<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Wish 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="fullscreen-prompt">Tap anywhere to start the celebration</div>
    <div class="year-container">
        <span class="year">Just</span>
        <span class="year highlight">Biology</span>
    </div>
    <div class="container">
        <div class="cake">
            <div class="plate"></div>
            <div class="layer layer-bottom"></div>
            <div class="layer layer-middle"></div>
            <div class="layer layer-top"></div>
            <div class="icing"></div>
            <div class="drip drip1"></div>
            <div class="drip drip2"></div>
            <div class="drip drip3"></div>
            <div class="candle">
                <div class="flame"></div>
            </div>
        </div>

        <span class="birthday">Wishing A Very Happy Birthday</span>
        <span class="birthday name">Soumendra Sir</span>

        <span class="birthday name">With utmost respect & love</span>
        <span class="birthday name">❤️ Sohan Shaw ❤️</span>

        <div class="age-container">
            <span class="birthday name fa label">May our beloved institute</span>
            <span class="birthday name fa label time">Flourish and reach new heights</span>
            <span class="birthday name fa label age">Forever Growing</span>
        </div>

    </div>
    <div class="wish-container">
        <span class="word">♥️</span>
        <span class="word">Just</span>
        <span class="word">Biology</span>
        <span class="word">✨</span>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
